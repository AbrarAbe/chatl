name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: analyze · format · test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # chatl ships for these two platforms (spec §Tech Stack).
                os: [ubuntu-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - uses: dart-lang/setup-dart@v1
              with:
                  sdk: 3.14.0-211.1.beta

            - name: Cache pub packages
              uses: actions/cache@v4
              with:
                  path: ~/.pub-cache
                  key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-pub-

            - name: Install dependencies
              run: dart pub get

            # The same gates the Definition of done in AGENTS.md requires, enforced
            # by machines instead of by the agent.
            # `.` covers lib/bin/test and tool/ once it exists; dot-directories
            # (.dart_tool) are skipped by dart format.
            - name: Check formatting
              run: dart format --output=none --set-exit-if-changed .

            - name: Analyze
              run: dart analyze --fatal-infos

            - name: Test
              run: dart test
