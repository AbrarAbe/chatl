name: chatl
description: "Chat-only terminal agent. No file reads, no file edits — only conversation."
publish_to: "none"
version: 0.1.0+1

environment:
    sdk: ^3.14.0-211.1.beta

dependencies:
    nocterm: ^0.9.0
    markdown: ^7.3.1
    drift: ^2.27.0
    sqlite3: ^2.9.0
    yaml: ^3.1.3
    args: ^2.7.0
    http: ^1.6.0
    path: ^1.9.1

dev_dependencies:
    test: ^1.26.3
    build_runner: ^2.4.15
    mockito: ^5.5.0
    lints: ^6.0.0
    drift_dev: ^2.31.0
    crypto: any
